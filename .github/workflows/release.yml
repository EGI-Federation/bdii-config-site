---
# When a tag is created
# - create a new release from the tag
# - build and attach packages to the release
name: Create packages and release

on:
  push:
    tags:
      - "v*"

jobs:
  almalinux8:
    name: Build AlmaLinux 8 RPMs
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build requisites
        run: |
          yum install -y rpm-build yum-utils
          yum-builddep -y bdii-config-site.spec
      - name: build rpm
        run: |
          make clean rpm
      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms8
          path: |
            build/RPMS/noarch/bdii-config-site-*-1.el8.noarch.rpm
            build/SRPMS/bdii-config-site-*-1.el8.src.rpm

  almalinux9:
    name: Build AlmaLinux 9 RPMs
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build requisites
        run: |
          yum install -y rpm-build yum-utils
          yum-builddep -y bdii-config-site.spec
      - name: build rpm
        run: |
          make clean rpm
      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms9
          path: |
            build/RPMS/noarch/bdii-config-site-*-1.el9.noarch.rpm
            build/SRPMS/bdii-config-site-*-1.el9.src.rpm

  release8:
    name: Upload AlmaLinux 8 release artefacts
    needs: almalinux8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rpms8
      - name: Find package name
        id: package_name_almalinux8
        run: |
          rpm_path=$(find . -name 'bdii-config-site-*-1.el8.noarch.rpm')
          src_path=$(find . -name 'bdii-config-site-*-1.el8.src.rpm')
          echo "rpm_path=${rpm_path}" >> "$GITHUB_OUTPUT"
          echo "src_path=${src_path}" >> "$GITHUB_OUTPUT"
      - name: Attach AlmaLinux 8 RPMs to the release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package_name_almalinux8.outputs.rpm_path }}
            ${{ steps.package_name_almalinux8.outputs.src_path }}

  release9:
    name: Upload AlmaLinux 9 release artefacts
    needs: almalinux9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rpms9
      - name: Find package name
        id: package_name_almalinux9
        run: |
          rpm_path=$(find . -name 'bdii-config-site-*-1.el9.noarch.rpm')
          src_path=$(find . -name 'bdii-config-site-*-1.el9.src.rpm')
          echo "rpm_path=${rpm_path}" >> "$GITHUB_OUTPUT"
          echo "src_path=${src_path}" >> "$GITHUB_OUTPUT"
      - name: Attach AlmaLinux 9 RPMs to the release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package_name_almalinux9.outputs.rpm_path }}
            ${{ steps.package_name_almalinux9.outputs.src_path }}
